name: Release

# Build the linux/amd64 server binary natively (no emulation) and attach it, with
# its SHA-256, to the GitHub release for the pushed tag. The droplet's
# `yuiolink-update` then pulls and verifies it. Binaries are release assets only --
# they never enter the git repository.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create/upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The footer renders both halves of a manually bumped pair: VERSION links
      # releases/tag/v{VERSION}, and RELEASE_DATE prints as "Updated ...". A tag
      # can only guarantee them if it refuses to release a mismatch, so check
      # here, before anything is built or published. The commit's own date (not
      # the build's) is the reference, so a re-run never changes the verdict.
      - name: Refuse a tag whose source disagrees with it
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag is $GITHUB_REF_NAME but Cargo.toml says $version -- the footer would link a wrong release" >&2
            exit 1
          fi
          release_date="$(sed -n 's/^const RELEASE_DATE: &str = "\(.*\)";$/\1/p' server/src/views.rs)"
          commit_date="$(git log -1 --format=%cs)"
          if [ "$release_date" != "$commit_date" ]; then
            echo "RELEASE_DATE is $release_date but the tagged commit was made $commit_date -- bump it with the version" >&2
            exit 1
          fi

      # Build with the newest Rust, but never an unrecorded one: resolve the
      # floating tag to a digest once, build with exactly that image, and
      # publish the digest and its rustc beside the binary. Rebuilding with
      # `--build-arg RUST_IMAGE=<that ref>` uses the same toolchain.
      - name: Pin the Rust image this release builds with
        run: |
          digest="$(docker buildx imagetools inspect rust:1-trixie --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "could not resolve rust:1-trixie to a digest" >&2; exit 1 ;; esac
          echo "RUST_IMAGE=rust:1-trixie@$digest" >> "$GITHUB_ENV"

      - name: Build the linux/amd64 binary via the repo Dockerfile
        run: |
          docker buildx build --platform linux/amd64 --build-arg RUST_IMAGE="$RUST_IMAGE" \
            -f Dockerfile -o type=local,dest=out .
          # A single-platform buildx export has no per-arch subdirectory.
          src="out/usr/local/bin/yuiolink-server"
          [ -f "$src" ] || src="out/linux_amd64/usr/local/bin/yuiolink-server"
          install -m0755 "$src" yuiolink-server-linux-amd64

      - name: Checksum
        run: sha256sum yuiolink-server-linux-amd64 | tee yuiolink-server-linux-amd64.sha256

      - name: Record the toolchain
        run: |
          {
            echo "image: $RUST_IMAGE"
            docker run --rm --platform linux/amd64 "$RUST_IMAGE" sh -c 'rustc -V && cargo -V'
          } | tee build-info.txt

      - name: Publish the binary to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            yuiolink-server-linux-amd64 yuiolink-server-linux-amd64.sha256 build-info.txt \
          || gh release upload "$GITHUB_REF_NAME" \
            yuiolink-server-linux-amd64 yuiolink-server-linux-amd64.sha256 build-info.txt --clobber
