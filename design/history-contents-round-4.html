<!DOCTYPE html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History Contents Round 4</title>
<link rel="stylesheet" href="../server/static/app.css">
<style>
body { display: block; padding: 28px 16px 48px; }
main { max-width: 1080px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 30px 0 4px; }
.lead { color: var(--text-secondary); font-size: 14px; margin: 0 0 18px; max-width: 72ch; text-align: left; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 22px; }
figure { margin: 0; }
figcaption { font-size: 13.5px; color: var(--text-secondary); margin: 0 0 8px; text-align: left; }
figcaption b { color: var(--text); font-size: 15px; margin-right: 6px; }
.history-list { min-height: 0; }
.history-snippet-body { flex: 1 1 auto; }


.history-actions .eye { padding: 14px 12px; margin: -10px 0; opacity: 0.85; }
.eye {
    flex: none; display: inline-flex; align-items: center; font: inherit;
    color: var(--text-secondary); background: none; border: 0; cursor: pointer;
}
.eye svg { display: block; }
.history-snippet.redirect .history-snippet-body::before { content: "\2192"; margin-right: 6px; font-size: 14px; font-weight: 600; color: var(--accent-text); font-family: var(--font); }
.cov { display: flex; align-items: center; height: 16px; }


.history-snippet-body { display: block; }
/* the blur spills past the line box; clipping it draws a hard grey band */
.history-snippet-body.covered { overflow: visible; }
.history-snippet:has(.covered) { overflow: visible; }
.cz { cursor: pointer; user-select: none; -webkit-user-select: none; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: clip; display: block; padding: 8px 0; margin: -8px 0; }
.cz:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
/* S1 plain blur */
.S1 .cz { filter: blur(3.5px); }
.S1 .cz:hover { filter: blur(3px); }
/* S2 heavy blur, faded out at a fixed width so the length never shows */
.S2 .cz { width: 100%; filter: blur(4.5px);
    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 55%, transparent 88%); mask-image: linear-gradient(90deg, #000 0, #000 55%, transparent 88%); }
/* S3 spoiler speckle: the glyphs filled with fine grain, then softened */
.S3 .cz { color: transparent; filter: blur(2.2px);
    background-image: radial-gradient(circle, color-mix(in srgb, var(--text) 55%, transparent) 0.6px, transparent 0.9px);
    background-size: 2.6px 2.6px; -webkit-background-clip: text; background-clip: text; }
.S3 .cz::after { content: none; }
/* S4 frosted strip over the real text: text shows through a milky glass band */
.S4 .cz { position: relative; filter: blur(2.6px); opacity: 0.75; }
.S4 .history-snippet-body { position: relative; }
.S4 .history-snippet-body.covered::after { content: ""; position: absolute; inset: 1px 0; border-radius: 5px;
    background: color-mix(in srgb, var(--field-bg) 55%, transparent);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--text) 8%, transparent); pointer-events: none; }
/* S5 scrambled + blur: real word lengths, random letters */
.S5 .cz { filter: blur(2.2px); }
</style>
</head>
<body>
<main>
<h1>History contents line, round 4</h1>
<p class="lead">The real text, covered, and clickable: click or tap the covered line to reveal it, and use the eye to cover it again. These are live, so try clicking. S5 shows a look-alike, not the real text, as the safe comparison.</p>
<div class="grid" id="grid"></div>
</main>
<script>
const ns = "http://www.w3.org/2000/svg";
const svg = (size, vb, parts) => {
    const s = document.createElementNS(ns, "svg");
    s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", vb);
    s.setAttribute("fill", "none"); s.setAttribute("aria-hidden", "true");
    for (const [tag, attrs] of parts) {
        const e = document.createElementNS(ns, tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        s.append(e);
    }
    return s;
};
const R = { stroke: "currentColor", "stroke-linecap": "round", "stroke-linejoin": "round" };
const eye = (off) => svg(15, "0 0 14 14", [
    ["path", { ...R, "stroke-width": "1.3", d: "M1.3 7C2.8 4.3 4.7 3 7 3s4.2 1.3 5.7 4C11.2 9.7 9.3 11 7 11S2.8 9.7 1.3 7Z" }],
    ["circle", { ...R, "stroke-width": "1.3", cx: "7", cy: "7", r: "1.9" }],
    ...(off ? [["path", { ...R, "stroke-width": "1.3", d: "M2.3 1.8 11.7 12.2" }]] : []),
]);
const lock = () => svg(12, "0 0 14 14", [
    ["rect", { ...R, "stroke-width": "1.4", x: "3", y: "6.2", width: "8", height: "5.8", rx: "1.4" }],
    ["path", { ...R, "stroke-width": "1.4", d: "M4.9 6.2V4.6a2.1 2.1 0 0 1 4.2 0v1.6" }],
]);
const copyI = () => svg(16, "0 0 14 14", [
    ["path", { stroke: "currentColor", "stroke-linecap": "round", d: "M9.6 2.2H3.6c-.77 0-1.4.63-1.4 1.4v6.2", "stroke-width": "1.6" }],
    ["rect", { stroke: "currentColor", x: "4.9", y: "4.7", width: "7", height: "7.2", rx: "1.3", "stroke-width": "1.6" }],
]);
const openI = () => svg(15, "0 0 13 13", [["path", { ...R, d: "M2.5 10.5 10.5 2.5M4 2.5h6.5V9", "stroke-width": "1.8" }]]);
const trashI = () => svg(16, "0 0 14 14", [["path", { ...R, "stroke-width": "1.4", d: "M2.6 3.9h8.8M5.6 3.9V2.7c0-.4.3-.7.7-.7h1.4c.4 0 .7.3.7.7v1.2M4 3.9l.5 7c0 .5.4.9.9.9h3.2c.5 0 .9-.4.9-.9l.5-7" }]]);
const h = (tag, cls, ...kids) => { const e = document.createElement(tag); if (cls) e.className = cls; e.append(...kids); return e; };




const SECRETS = ["The wifi password is hunter2 and the door code is 4711", "hunter2", "Meet at the north gate at nine, bring the blue folder and the keys"];
const NAMES = [["hazing", "VALLEY", "junior", "GALA"], ["brave", "OTTER", "quiet", "MOSS"], ["amber", "FIELD", "north", "TIDE"]];
let seed = 5;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const scramble = (s) => s.replace(/[a-z]/g, () => "abcdefghijklmnopqrstuvwxyz"[Math.floor(rnd() * 26)]).replace(/[A-Z]/g, () => "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[Math.floor(rnd() * 26)]).replace(/[0-9]/g, () => String(Math.floor(rnd() * 10)));
const url = (name) => {
    const u = h("div", "history-url");
    u.append(h("span", "u-scheme", "https://"), h("span", "u-host", "yuio.link"), h("span", "u-sep", "/"));
    const n = h("span", "u-name"); name.forEach((w, i) => n.append(h("span", "nw-" + (i % 2), w))); u.append(n);
    return u;
};
const foot = (kind, extra) => {
    const f = h("div", "history-foot");
    const m = h("small", "history-meta", h("span", "kind-word " + kind.toLowerCase(), kind), " · ", h("span", "countdown", "7 days left"));
    const a = h("div", "history-actions", h("span", "history-check"));
    if (extra) a.append(extra);
    a.append(h("a", "history-copy", copyI()), h("a", "history-show", openI()), h("button", "history-remove", trashI()));
    f.append(m, a); return f;
};
const priv = (x, i) => {
    const li = h("li", "history-item");
    const l = h("div", "history-snippet text");
    const b = h("span", "history-snippet-body");
    const eb = h("button", "eye");
    let covered = true;
    const draw = () => {
        b.replaceChildren(); b.classList.toggle("covered", covered);
        if (covered) {
            const c = h("button", "cz", x === "S5" ? scramble(SECRETS[i]) : SECRETS[i]);
            if (x === "S2") c.append(" " + scramble("lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor"));
            c.setAttribute("aria-label", "Show contents");
            c.addEventListener("click", () => { covered = false; draw(); });
            b.append(c);
        } else b.textContent = SECRETS[i];
        eb.replaceChildren(eye(!covered));
    };
    eb.addEventListener("click", () => { covered = !covered; draw(); });
    draw();
    l.append(b);
    li.append(url(NAMES[i]), l, foot("Text", eb));
    return li;
};
const X = {
    S1: ["Blur", "The real text under a moderate blur. Shows its length and word shapes."],
    S2: ["Blur, fixed width", "A heavier blur. Look-alike filler runs on after the real text and the line fades at the same point on every row, so length never shows."],
    S4: ["Frosted band", "The blurred text seen through a milky glass band."],
    S5: ["Look-alike", "For comparison: same word lengths, random letters, blurred. Not the real text."],
};
for (const [k, [t, d]] of Object.entries(X)) {
    seed = 5;
    const ul = h("ul", "history-list " + k, priv(k, 0), priv(k, 1), priv(k, 2));
    document.getElementById("grid").append(h("figure", "", h("figcaption", "", h("b", "", k + " · " + t), d), ul));
}
</script>
</body>
</html>
