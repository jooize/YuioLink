:root{--bg:#f3f5f9;--card:#fff;--text:#1d1d1f;--sub:#6e6e73;--edge:rgba(0,0,0,.08)}

figcaption{margin-top:12px;display:grid;gap:4px}figcaption span{color:var(--sub);font-size:13.5px}
