<!DOCTYPE html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History Contents Round 3</title>
<link rel="stylesheet" href="../server/static/app.css">
<style>
body { display: block; padding: 28px 16px 48px; }
main { max-width: 1080px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 30px 0 4px; }
.lead { color: var(--text-secondary); font-size: 14px; margin: 0 0 18px; max-width: 72ch; text-align: left; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 22px; }
figure { margin: 0; }
figcaption { font-size: 13.5px; color: var(--text-secondary); margin: 0 0 8px; text-align: left; }
figcaption b { color: var(--text); font-size: 15px; margin-right: 6px; }
.history-list { min-height: 0; }
.history-snippet-body { flex: 1 1 auto; }


.history-actions .eye { padding: 14px 12px; margin: -10px 0; opacity: 0.85; }
.eye {
    flex: none; display: inline-flex; align-items: center; font: inherit;
    color: var(--text-secondary); background: none; border: 0; cursor: pointer;
}
.eye svg { display: block; }
.history-snippet.redirect .history-snippet-body::before { content: "\2192"; margin-right: 6px; font-size: 14px; font-weight: 600; color: var(--accent-text); font-family: var(--font); }
.cov { display: flex; align-items: center; height: 16px; }

/* X1 ghost words */
.X1 .cov { gap: 5px; }
.X1 .cov i { display: block; height: 7px; border-radius: 3.5px; background: color-mix(in srgb, var(--text) 10%, transparent); }
/* X2 ink stroke: one tapered line that fades out */
.X2 .cov i { display: block; height: 2px; border-radius: 1px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--text) 26%, transparent), transparent); }
/* X3 redaction tape: a capsule with fine diagonal hatching */
.X3 .cov i { display: block; height: 10px; border-radius: 5px;
    background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--text) 11%, transparent) 0 1.5px, transparent 1.5px 4.5px);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--text) 12%, transparent); }
/* X4 kind-tinted ghost words: Text orange, faint */
.X4 .cov { gap: 5px; }
.X4 .cov i { display: block; height: 7px; border-radius: 3.5px; background: color-mix(in srgb, var(--text-kind) 22%, transparent); }
/* X5 a word */
.X5 .cov { gap: 5px; color: var(--text-tertiary); font-size: 12.5px; }
/* X6 gradient glass bar: a capsule lit from the left, like glass catching light */
.X6 .cov i { display: block; height: 10px; border-radius: 5px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 16%, transparent), color-mix(in srgb, #ff4081 14%, transparent));
    box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.5), inset 0 0 0 0.5px color-mix(in srgb, var(--text) 8%, transparent); }
</style>
</head>
<body>
<main>
<h1>History contents line, round 3</h1>
<p class="lead">Six covers other than frosted glass. The eye sits beside the actions (P2) and redirects use the blue arrow (R3). Each cover's shape is random per row but stays the same across reloads, and it has nothing to do with the real contents.</p>
<div class="grid" id="grid"></div>
</main>
<script>
const ns = "http://www.w3.org/2000/svg";
const svg = (size, vb, parts) => {
    const s = document.createElementNS(ns, "svg");
    s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", vb);
    s.setAttribute("fill", "none"); s.setAttribute("aria-hidden", "true");
    for (const [tag, attrs] of parts) {
        const e = document.createElementNS(ns, tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        s.append(e);
    }
    return s;
};
const R = { stroke: "currentColor", "stroke-linecap": "round", "stroke-linejoin": "round" };
const eye = (off) => svg(15, "0 0 14 14", [
    ["path", { ...R, "stroke-width": "1.3", d: "M1.3 7C2.8 4.3 4.7 3 7 3s4.2 1.3 5.7 4C11.2 9.7 9.3 11 7 11S2.8 9.7 1.3 7Z" }],
    ["circle", { ...R, "stroke-width": "1.3", cx: "7", cy: "7", r: "1.9" }],
    ...(off ? [["path", { ...R, "stroke-width": "1.3", d: "M2.3 1.8 11.7 12.2" }]] : []),
]);
const lock = () => svg(12, "0 0 14 14", [
    ["rect", { ...R, "stroke-width": "1.4", x: "3", y: "6.2", width: "8", height: "5.8", rx: "1.4" }],
    ["path", { ...R, "stroke-width": "1.4", d: "M4.9 6.2V4.6a2.1 2.1 0 0 1 4.2 0v1.6" }],
]);
const copyI = () => svg(16, "0 0 14 14", [
    ["path", { stroke: "currentColor", "stroke-linecap": "round", d: "M9.6 2.2H3.6c-.77 0-1.4.63-1.4 1.4v6.2", "stroke-width": "1.6" }],
    ["rect", { stroke: "currentColor", x: "4.9", y: "4.7", width: "7", height: "7.2", rx: "1.3", "stroke-width": "1.6" }],
]);
const openI = () => svg(15, "0 0 13 13", [["path", { ...R, d: "M2.5 10.5 10.5 2.5M4 2.5h6.5V9", "stroke-width": "1.8" }]]);
const trashI = () => svg(16, "0 0 14 14", [["path", { ...R, "stroke-width": "1.4", d: "M2.6 3.9h8.8M5.6 3.9V2.7c0-.4.3-.7.7-.7h1.4c.4 0 .7.3.7.7v1.2M4 3.9l.5 7c0 .5.4.9.9.9h3.2c.5 0 .9-.4.9-.9l.5-7" }]]);
const h = (tag, cls, ...kids) => { const e = document.createElement(tag); if (cls) e.className = cls; e.append(...kids); return e; };



const SECRETS = ["The wifi password is hunter2 and the door code is 4711"];
const NAMES = [["hazing", "VALLEY", "junior", "GALA"], ["brave", "OTTER", "quiet", "MOSS"], ["amber", "FIELD", "north", "TIDE"]];
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const px = (lo, hi) => Math.round(lo + rnd() * (hi - lo)) + "px";
const cover = (x) => {
    const c = h("span", "cov");
    if (x === "X1" || x === "X4") { const n = 3 + Math.floor(rnd() * 4); for (let i = 0; i < n; i++) { const e = h("i", ""); e.style.width = px(18, 64); c.append(e); } }
    else if (x === "X5") c.append(lock(), "Hidden");
    else { const e = h("i", ""); e.style.width = px(110, 280); c.append(e); }
    return c;
};
const url = (name) => {
    const u = h("div", "history-url");
    u.append(h("span", "u-scheme", "https://"), h("span", "u-host", "yuio.link"), h("span", "u-sep", "/"));
    const n = h("span", "u-name"); name.forEach((w, i) => n.append(h("span", "nw-" + (i % 2), w))); u.append(n);
    return u;
};
const foot = (kind, extra) => {
    const f = h("div", "history-foot");
    const m = h("small", "history-meta", h("span", "kind-word " + kind.toLowerCase(), kind), " · ", h("span", "countdown", "7 days left"));
    const a = h("div", "history-actions", h("span", "history-check"));
    if (extra) a.append(extra);
    a.append(h("a", "history-copy", copyI()), h("a", "history-show", openI()), h("button", "history-remove", trashI()));
    f.append(m, a); return f;
};
const priv = (x, i, covered) => {
    const l = h("div", "history-snippet text");
    const b = h("span", "history-snippet-body");
    if (covered) b.append(cover(x)); else b.textContent = SECRETS[0];
    l.append(b);
    return h("li", "history-item", url(NAMES[i]), l, foot("Text", h("button", "eye", eye(!covered))));
};
const redir = () => {
    const l = h("div", "history-snippet redirect", h("span", "history-snippet-body", "example.com/some/long/path/to/a/page?with=query"));
    return h("li", "history-item", url(["hero"]), l, foot("Redirect"));
};
const X = {
    X1: ["Ghost words", "Soft grey bars shaped like words, a random run of them."],
    X2: ["Ink stroke", "One thin line that fades out to the right, of random length."],
    X3: ["Redaction tape", "A capsule of fine diagonal hatching, of random length."],
    X4: ["Tinted ghost words", "Ghost words in a faint wash of the row's kind color."],
    X5: ["A word", "A small lock and “Hidden”, nothing drawn."],
    X6: ["Glass bar", "A capsule tinted with the page's two glows, lit along its top edge."],
};
for (const [k, [t, d]] of Object.entries(X)) {
    seed = 11;
    const ul = h("ul", "history-list " + k, priv(k, 0, true), priv(k, 1, true), priv(k, 2, true), priv(k, 0, false), redir());
    document.getElementById("grid").append(h("figure", "", h("figcaption", "", h("b", "", k + " · " + t), d), ul));
}
</script>
</body>
</html>
